repos:
  - repo: local
    hooks:
    - id: format
      name: format
      entry: uv run ruff format .
      language: system
      types: [python]
      pass_filenames: false

    - id: lint
      name: lint
      entry: uv run ruff check --fix .
      language: system
      types: [python]
      pass_filenames: false

